
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Invoice Tracking System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Smart Invoice Tracking System</h1>

<div class="container">
    <h2>Create Invoice</h2>

    <input type="text" id="invoiceNumber" placeholder="Invoice Number (optional)">
    <input type="text" id="customerName" placeholder="Customer Name" required>
    <input type="email" id="customerEmail" placeholder="Customer Email">
    <input type="text" id="customerPhone" placeholder="Customer Phone">
    <input type="text" id="customerAddress" placeholder="Customer Address">

    <input type="text" id="productName" placeholder="Product / Service Name">
    <input type="number" id="quantity" placeholder="Quantity" min="1" value="1">
    <input type="number" id="unitPrice" placeholder="Unit Price (₹)" min="0" step="0.01">
    <input type="number" id="discount" placeholder="Discount Amount (₹)" min="0" value="0" step="0.01">
    <input type="number" id="tax" placeholder="Tax Percentage (%)" min="0" value="0" step="0.01">
    <input type="number" id="paidAmount" placeholder="Paid Amount (₹)" min="0" value="0" step="0.01">

    <label for="invoiceDate">Invoice Date</label>
    <input type="date" id="invoiceDate">

    <label for="dueDate">Due Date</label>
    <input type="date" id="dueDate">

    <select id="paymentMethod">
        <option value="">Select Payment Method</option>
        <option value="CASH">Cash</option>
        <option value="UPI">UPI</option>
        <option value="CARD">Card</option>
        <option value="BANK TRANSFER">Bank Transfer</option>
    </select>

    <textarea id="notes" placeholder="Notes (optional)" rows="3"></textarea>

    <button onclick="createInvoice()">Add Invoice</button>
</div>

<div class="container">
    <h2>Invoice List</h2>
    <button onclick="loadInvoices()">Load Invoices</button>
    <div id="invoiceList"></div>
</div>

<div class="container">
    <h2>Customer Management</h2>

    <input type="hidden" id="customerId">
    <input type="text" id="newCustomerName" placeholder="Customer Name">
    <input type="email" id="newCustomerEmail" placeholder="Email">
    <input type="text" id="newCustomerPhone" placeholder="Phone">
    <input type="text" id="newCustomerAddress" placeholder="Address">
    <input type="text" id="newCustomerGst" placeholder="GST Number">

    <button onclick="saveCustomer()">Save Customer</button>
    <button onclick="resetCustomerForm()">Clear Form</button>
    <button onclick="loadCustomers()">Load Customers</button>

    <div id="customerList"></div>
</div>

<script src="script.js"></script>
</body>
</html>
